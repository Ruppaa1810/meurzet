<div class="max-w-md mx-auto bg-slate-50 text-slate-800 min-h-screen pb-24 shadow-md border-x border-slate-200 relative font-sans">
  
  <header class="bg-blue-900 text-white p-6 rounded-b-[32px] shadow-md">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-black tracking-wider italic font-mono">PLATAFORMA</h1>
      <span class="bg-blue-800 text-xs font-bold px-3 py-1 rounded-full border border-blue-700">v2.1</span>
    </div>
    <p class="text-blue-200 text-xs font-medium">Buscá y reservá tus pasajes de forma rápida y segura.</p>
  </header>

  <main class="p-4 -mt-6">
    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-lg flex flex-col gap-4">
      
      <div class="relative mt-1">
        <label class="text-[10px] font-black text-slate-400 absolute -top-2 left-3 bg-white px-1 tracking-wider uppercase">ORIGEN</label>
        <div class="flex items-center border border-slate-200 rounded-lg p-3 bg-white shadow-sm focus-within:border-blue-900 transition-colors">
          <svg class="w-4 h-4 text-slate-400 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
          </svg>
          <input class="bg-transparent border-none p-0 focus:outline-none w-full text-xs font-bold text-slate-800" type="text" value="Buenos Aires (Retiro)"/>
        </div>
      </div>

      <div class="relative mt-1">
        <label class="text-[10px] font-black text-slate-400 absolute -top-2 left-3 bg-white px-1 tracking-wider uppercase">DESTINO</label>
        <div class="flex items-center border border-slate-200 rounded-lg p-3 bg-white shadow-sm focus-within:border-blue-900 transition-colors">
          <svg class="w-4 h-4 text-slate-400 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
          </svg>
          <input class="bg-transparent border-none p-0 focus:outline-none w-full text-xs font-bold text-slate-800" type="text" value="Mendoza (Terminal)"/>
        </div>
      </div>

      <div class="relative mt-1">
        <label class="text-[10px] font-black text-slate-400 absolute -top-2 left-3 bg-white px-1 tracking-wider uppercase">FECHA DE VIAJE</label>
        <div class="flex items-center border border-slate-200 rounded-lg p-3 bg-white shadow-sm focus-within:border-blue-900 transition-colors">
          <svg class="w-4 h-4 text-slate-400 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
          </svg>
          <input class="bg-transparent border-none p-0 focus:outline-none w-full text-xs font-bold text-slate-800" type="text" value="Jueves, 24 de Octubre"/>
        </div>
      </div>

      <div class="relative mt-1">
        <label class="text-[10px] font-black text-slate-400 absolute -top-2 left-3 bg-white px-1 tracking-wider uppercase">PASAJEROS</label>
        <div class="flex items-center border border-slate-200 rounded-lg p-3 bg-white shadow-sm focus-within:border-blue-900 transition-colors">
          <svg class="w-4 h-4 text-slate-400 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
          </svg>
          <input class="bg-transparent border-none p-0 focus:outline-none w-full text-xs font-bold text-slate-800" type="text" value="2 Adultos"/>
        </div>
      </div>

      <button class="w-full bg-blue-900 hover:bg-blue-950 text-white font-extrabold py-3.5 rounded-xl text-xs tracking-wider transition-all shadow-md mt-2 uppercase">
        Buscar Servicios
      </button>

    </div>

    <div class="mt-4 grid grid-cols-2 gap-3">
      <div class="bg-white p-3 border border-slate-200 rounded-xl shadow-sm text-center">
        <p class="text-blue-900 font-black text-sm">100% Online</p>
        <p class="text-[10px] text-slate-400 font-bold mt-0.5">Evitá las filas</p>
      </div>
      <div class="bg-white p-3 border border-slate-200 rounded-xl shadow-sm text-center">
        <p class="text-emerald-700 font-black text-sm">Soporte 24/7</p>
        <p class="text-[10px] text-slate-400 font-bold mt-0.5">Asistencia inmediata</p>
      </div>
    </div>
  </main>
</div>
