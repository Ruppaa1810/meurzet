<div (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">

  <!-- MOBILE HEADER -->
  <header class="lg:hidden h-[60px] bg-meurzet-primary flex items-center justify-between px-4 sticky top-0 z-50 border-b-[3px] border-meurzet-accent">
    <button (click)="toggleSidebar()" class="w-10 h-10 rounded-xl bg-white/10 flex flex-col justify-center items-center gap-1 hover:bg-white/20 transition-all border-none cursor-pointer">
      <span class="w-5 h-0.5 bg-white rounded-full"></span>
      <span class="w-5 h-0.5 bg-white rounded-full"></span>
      <span class="w-5 h-0.5 bg-white rounded-full"></span>
    </button>
    <div class="flex items-center gap-2">
      <img src="/logo.jpeg" class="w-8 h-8 rounded-full object-cover" />
      <span class="text-white font-bold text-sm">Meurzet</span>
    </div>
    <div class="w-10"></div>
  </header>

  <!-- OVERLAY (mobile only) -->
  @if (sidebarOpen) {
    <div class="lg:hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-40" (click)="closeSidebar()"></div>
  }

  <!-- SIDEBAR -->
  <div class="w-[260px] bg-meurzet-primary text-white h-screen flex flex-col transition-transform duration-300 ease-in-out
    fixed left-0 top-0 z-50 lg:z-auto
    lg:translate-x-0
    {{ sidebarOpen ? 'translate-x-0' : '-translate-x-full' }}">

    <div class="p-6 border-b border-white/10 flex items-center gap-3">
      <div class="w-10 h-10 bg-gradient-to-br from-meurzet-accent to-meurzet-secondary rounded-xl flex items-center justify-center font-bold text-lg overflow-hidden">
        <img src="/logo.jpeg" alt="Meurzet" class="w-full h-full object-cover" />
      </div>
      <div>
        <div class="font-bold text-lg tracking-wide">Meurzet</div>
        <div class="text-[0.55rem] text-meurzet-muted tracking-wider font-semibold">
          VIAJES Y TURISMO
        </div>
      </div>
    </div>

    <nav class="flex-1 mt-6 px-3">
      <a class="flex items-center gap-3 px-4 py-[0.6rem] mx-4 my-1 rounded-xl text-meurzet-muted no-underline text-sm transition-all duration-200 hover:bg-white/10 hover:text-white" routerLink="/admin" routerLinkActive="bg-meurzet-accent text-white" [routerLinkActiveOptions]="{exact: true}" (click)="closeSidebar()">
        <svg class="w-[1.1rem] h-[1.1rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
        Panel de Control
      </a>
      <a class="flex items-center gap-3 px-4 py-[0.6rem] mx-4 my-1 rounded-xl text-meurzet-muted no-underline text-sm transition-all duration-200 hover:bg-white/10 hover:text-white" routerLink="/admin/validaciones" routerLinkActive="bg-meurzet-accent text-white" (click)="closeSidebar()">
        <svg class="w-[1.1rem] h-[1.1rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
        Validaciones
      </a>
      <a class="flex items-center gap-3 px-4 py-[0.6rem] mx-4 my-1 rounded-xl text-meurzet-muted no-underline text-sm transition-all duration-200 hover:bg-white/10 hover:text-white" routerLink="/admin/flota" routerLinkActive="bg-meurzet-accent text-white" (click)="closeSidebar()">
        <svg class="w-[1.1rem] h-[1.1rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 17a2 2 0 11-4 0 2 2 0 014 0zM20 17a2 2 0 11-4 0 2 2 0 014 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 17h2m10 0h2a2 2 0 002-2v-3a2 2 0 00-2-2h-3V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h6m2 0h2" />
        </svg>
        Flota
      </a>
      <a class="flex items-center gap-3 px-4 py-[0.6rem] mx-4 my-1 rounded-xl text-meurzet-muted no-underline text-sm transition-all duration-200 hover:bg-white/10 hover:text-white" routerLink="/admin/viajes" routerLinkActive="bg-meurzet-accent text-white" (click)="closeSidebar()">
        <svg class="w-[1.1rem] h-[1.1rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Viajes
      </a>

      @if (esAdmin) {
      <a class="flex items-center gap-3 px-4 py-[0.6rem] mx-4 my-1 rounded-xl text-meurzet-muted no-underline text-sm transition-all duration-200 hover:bg-white/10 hover:text-white" routerLink="/admin/auditoria" routerLinkActive="bg-meurzet-accent text-white" (click)="closeSidebar()">
        <svg class="w-[1.1rem] h-[1.1rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        Auditoría
      </a>
      }
      <a class="flex items-center gap-3 px-4 py-[0.6rem] mx-4 my-1 rounded-xl text-meurzet-muted no-underline text-sm transition-all duration-200 hover:bg-white/10 hover:text-white" routerLink="/admin/minoristas" routerLinkActive="bg-meurzet-accent text-white" (click)="closeSidebar()">
        <svg class="w-[1.1rem] h-[1.1rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Minoristas
      </a>
      <a class="flex items-center gap-3 px-4 py-[0.6rem] mx-4 my-1 rounded-xl text-meurzet-muted no-underline text-sm transition-all duration-200 hover:bg-white/10 hover:text-white text-red-400 cursor-pointer mt-auto" (click)="logout()">
        <svg class="w-[1.1rem] h-[1.1rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Cerrar Sesión
      </a>
    </nav>

    <div class="p-5 border-t border-white/[0.06] flex items-center gap-3">
      <div class="w-8 h-8 rounded-full overflow-hidden">
        <img src="/logo.jpeg" alt="Admin" class="w-full h-full object-cover" />
      </div>
      <div>
        <div class="text-[0.8rem] font-semibold">{{ nombreUsuario }}</div>
        <div class="text-[0.65rem] text-meurzet-muted">{{ agenciaNombre }}</div>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="lg:ml-[260px] min-h-screen overflow-y-auto">
    <div class="flex justify-between items-center px-10 py-5 bg-white border-b border-slate-200">
      <div>
        <h1 class="text-[1.35rem] text-meurzet-accent font-bold m-0">
          {{ tituloPagina }}
        </h1>
      </div>
    </div>

    <router-outlet></router-outlet>
  </div>
</div>
