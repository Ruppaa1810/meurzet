<div class="app-layout">
  <div class="sidebar">
    <div class="logo-area">
      <div class="logo-circle" style="overflow: hidden; background: transparent">
        <img src="/logo.jpeg" alt="Meurzet" style="width: 100%; height: 100%; object-fit: cover" />
      </div>
      <div>
        <div style="font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px">Meurzet</div>
        <div style="font-size: 0.55rem; color: var(--color-meurzet-gray); letter-spacing: 1.5px; font-weight: 600;">
          VIAJES Y TURISMO
        </div>
      </div>
    </div>

    <nav style="flex: 1; margin-top: 1.5rem; padding: 0 0.75rem">
      <a class="nav-item" routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <svg style="width: 1.1rem; height: 1.1rem" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
        Panel de Control
      </a>
      <a class="nav-item" routerLink="/admin/validaciones" routerLinkActive="active">
        <svg style="width: 1.1rem; height: 1.1rem" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
        Validaciones
      </a>
      <a class="nav-item" routerLink="/admin/flota" routerLinkActive="active">
        <svg style="width: 1.1rem; height: 1.1rem" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 17a2 2 0 11-4 0 2 2 0 014 0zM20 17a2 2 0 11-4 0 2 2 0 014 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 17h2m10 0h2a2 2 0 002-2v-3a2 2 0 00-2-2h-3V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h6m2 0h2" />
        </svg>
        Flota
      </a>
      <a class="nav-item" routerLink="/admin/viajes" routerLinkActive="active">
        <svg style="width: 1.1rem; height: 1.1rem" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Viajes
      </a>
      <a class="nav-item" routerLink="/admin/minoristas" routerLinkActive="active">
        <svg style="width: 1.1rem; height: 1.1rem" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Minoristas
      </a>
      <a class="nav-item" routerLink="/admin/mayoristas" routerLinkActive="active">
        <svg style="width: 1.1rem; height: 1.1rem" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
        Mayoristas
      </a>
      <a class="nav-item" (click)="logout()" style="cursor: pointer; margin-top: auto; color: #f87171;">
        <svg style="width: 1.1rem; height: 1.1rem" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Cerrar Sesión
      </a>
    </nav>

    <div style="padding: 1.25rem; border-top: 1px solid rgba(255, 255, 255, 0.06); display: flex; align-items: center; gap: 0.75rem;">
      <div style="width: 32px; height: 32px; border-radius: 50%; overflow: hidden">
        <img src="/logo.jpeg" alt="Admin" style="width: 100%; height: 100%; object-fit: cover" />
      </div>
      <div>
        <div style="font-size: 0.8rem; font-weight: 600">{{ nombreUsuario }}</div>
        <div style="font-size: 0.65rem; color: var(--color-meurzet-gray)">{{ agenciaNombre }}</div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 2.5rem; background: white; border-bottom: 1px solid #e2e8f0;">
      <div>
        <h1 style="font-size: 1.35rem; color: var(--color-meurzet-primary); font-weight: 700; margin: 0;">
          Administración
        </h1>
      </div>

      <div style="display: flex; align-items: center; gap: 1.5rem;">
        <div style="position: relative; display: flex; align-items: center;">
          <svg style="width: 1rem; height: 1rem; color: #94a3b8; position: absolute; left: 1rem;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" placeholder="Buscar..." style="padding: 0.5rem 1rem 0.5rem 2.5rem; background: #f1f5f9; border: none; border-radius: 9999px; font-size: 0.85rem; width: 240px; outline: none; color: #334155;" />
        </div>
      </div>
    </div>

    <router-outlet></router-outlet>
  </div>
</div>
