<div class="min-h-screen bg-[#f4f4f3] flex items-center justify-center py-8">
  
  <div class="w-full max-w-4xl mx-auto px-4 md:px-8">
    
    @if (loading) {
      <div class="flex items-center justify-center h-[60vh]">
        <div class="text-center">
          <svg class="animate-spin w-10 h-10 text-[#af4f35] mx-auto mb-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <p class="text-slate-500 font-medium text-xs">Cargando perfil...</p>
        </div>
      </div>
    } @else {
      
      <!-- DATOS PERSONALES -->
      <div class="bg-white rounded-2xl shadow-lg border-2 border-[#eec997] overflow-hidden transition-all duration-300 hover:shadow-xl mb-6">
        <div class="px-6 md:px-8 py-4 border-b border-[#eec997] bg-[#f4f4f3]">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-[#af4f35]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <h3 class="font-bold text-[#384752] text-md md:text-lg">Datos Personales</h3>
          </div>
          <p class="text-[11px] text-slate-400 mt-0.5">Información de tu cuenta</p>
        </div>
        
        <div class="p-6 md:p-8">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1.5">Nombre completo</label>
              <input type="text" [(ngModel)]="editNombre" name="nombre"
                class="w-full px-5 py-3.5 border-2 border-[#af4f35]/20 rounded-xl text-sm outline-none transition-all duration-200 focus:border-[#1aa7c4] focus:ring-2 focus:ring-[#1aa7c4]/20 hover:border-[#1aa7c4]">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1.5">Agencia / Local</label>
              <input type="text" [(ngModel)]="editAgencia" name="agencia"
                class="w-full px-5 py-3.5 border-2 border-[#af4f35]/20 rounded-xl text-sm outline-none transition-all duration-200 focus:border-[#1aa7c4] focus:ring-2 focus:ring-[#1aa7c4]/20 hover:border-[#1aa7c4]">
            </div>
          </div>
          
          <div class="mt-7 flex items-center justify-between flex-wrap gap-4">
            <button (click)="guardarPerfil()" [disabled]="savingProfile"
              class="px-8 py-3 rounded-xl text-white text-sm font-bold cursor-pointer transition-all duration-300 bg-gradient-to-r from-[#af4f35] to-[#e4912e] hover:from-[#1aa7c4] hover:to-[#384752] hover:shadow-lg transform hover:-translate-y-0.5 disabled:opacity-60">
              {{ savingProfile ? 'Guardando...' : 'Guardar cambios' }}
            </button>
            @if (profileMessage) {
              <p class="text-xs font-semibold flex items-center gap-1"
                [class.text-green-600]="profileMessage.includes('correctamente')"
                [class.text-red-600]="!profileMessage.includes('correctamente')">
                <span>✓</span>
                {{ profileMessage }}
              </p>
            }
          </div>
        </div>
      </div>

      <!-- CAMBIAR CONTRASEÑA -->
      <div class="bg-white rounded-2xl shadow-lg border-2 border-[#eec997] overflow-hidden transition-all duration-300 hover:shadow-xl">
        <div class="px-6 md:px-8 py-4 border-b border-[#eec997] bg-[#f4f4f3]">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-[#af4f35]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
            <h3 class="font-bold text-[#384752] text-md md:text-lg">Cambiar Contraseña</h3>
          </div>
          <p class="text-[11px] text-slate-400 mt-0.5">Actualizá tu contraseña de acceso</p>
        </div>
        
        <div class="p-6 md:p-8">
          <div class="space-y-6">
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1.5">Nueva contraseña</label>
              <input type="password" [(ngModel)]="newPassword" name="newPassword"
                placeholder="Mínimo 6 caracteres"
                class="w-full px-5 py-3.5 border-2 border-[#af4f35]/20 rounded-xl text-sm outline-none transition-all duration-200 focus:border-[#1aa7c4] focus:ring-2 focus:ring-[#1aa7c4]/20 hover:border-[#1aa7c4]">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1.5">Confirmar contraseña</label>
              <input type="password" [(ngModel)]="newPasswordConfirm" name="newPasswordConfirm"
                placeholder="Repetí la nueva contraseña"
                class="w-full px-5 py-3.5 border-2 border-[#af4f35]/20 rounded-xl text-sm outline-none transition-all duration-200 focus:border-[#1aa7c4] focus:ring-2 focus:ring-[#1aa7c4]/20 hover:border-[#1aa7c4]">
            </div>
          </div>
          
          <div class="mt-7 flex items-center justify-between flex-wrap gap-4">
            <button (click)="cambiarPassword()" [disabled]="savingPassword"
              class="px-8 py-3 rounded-xl text-white text-sm font-bold cursor-pointer transition-all duration-300 bg-gradient-to-r from-[#af4f35] to-[#e4912e] hover:from-[#1aa7c4] hover:to-[#384752] hover:shadow-lg transform hover:-translate-y-0.5 disabled:opacity-60">
              {{ savingPassword ? 'Guardando...' : 'Cambiar contraseña' }}
            </button>
            @if (passwordMessage) {
              <p class="text-xs font-semibold flex items-center gap-1"
                [class.text-green-600]="passwordMessage.includes('correctamente')"
                [class.text-red-600]="!passwordMessage.includes('correctamente')">
                <span>✓</span>
                {{ passwordMessage }}
              </p>
            }
          </div>
        </div>
      </div>

    }
  </div>
</div>
