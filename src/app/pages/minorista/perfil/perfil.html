<div class="p-8 max-w-[600px]">
  <h2 class="text-2xl font-bold text-[#384752] mb-2">Mi Perfil</h2>
  <p class="text-slate-500 text-sm mb-8">Tus datos personales.</p>

  @if (loading) {
    <p class="text-slate-500">Cargando...</p>
  } @else if (perfil) {
    <div class="bg-white rounded-2xl p-6 shadow-sm mb-6">
      <h3 class="text-base font-bold mb-4 text-[#384752]">Datos Personales</h3>
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre</label>
        <input type="text" [(ngModel)]="editNombre" name="nombre"
          class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm outline-none transition-all focus:border-[#af4f35] focus:ring-[3px] focus:ring-[#af4f35]/10">
      </div>
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Agencia</label>
        <input type="text" [(ngModel)]="editAgencia" name="agencia"
          class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm outline-none transition-all focus:border-[#af4f35] focus:ring-[3px] focus:ring-[#af4f35]/10">
      </div>
      <button (click)="guardarPerfil()" [disabled]="savingProfile"
        class="px-6 py-2.5 rounded-xl text-white text-sm font-bold border-none cursor-pointer transition-all"
        [class.opacity-60]="savingProfile"
        style="background: linear-gradient(135deg, #af4f35, #e4912e);">
        {{ savingProfile ? 'Guardando...' : 'Guardar cambios' }}
      </button>
      @if (profileMessage) {
        <p class="mt-3 text-sm font-semibold"
          [class.text-green-600]="profileMessage.includes('correctamente')"
          [class.text-red-600]="!profileMessage.includes('correctamente')">
          {{ profileMessage }}
        </p>
      }
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-sm mb-6">
      <h3 class="text-base font-bold mb-4 text-[#384752]">Cambiar Contraseña</h3>
      <p class="text-xs text-slate-500 mb-4">Actualizá tu contraseña de acceso.</p>
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Nueva contraseña</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword"
          placeholder="Mín. 6 caracteres"
          class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm outline-none transition-all focus:border-[#af4f35] focus:ring-[3px] focus:ring-[#af4f35]/10">
      </div>
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Confirmar contraseña</label>
        <input type="password" [(ngModel)]="newPasswordConfirm" name="newPasswordConfirm"
          placeholder="Repetí la contraseña"
          class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm outline-none transition-all focus:border-[#af4f35] focus:ring-[3px] focus:ring-[#af4f35]/10">
      </div>
      <button (click)="cambiarPassword()" [disabled]="savingPassword"
        class="px-6 py-2.5 rounded-xl text-white text-sm font-bold border-none cursor-pointer transition-all"
        [class.opacity-60]="savingPassword"
        style="background: linear-gradient(135deg, #af4f35, #e4912e);">
        {{ savingPassword ? 'Guardando...' : 'Cambiar contraseña' }}
      </button>
      @if (passwordMessage) {
        <p class="mt-3 text-sm font-semibold"
          [class.text-green-600]="passwordMessage.includes('correctamente')"
          [class.text-red-600]="!passwordMessage.includes('correctamente')">
          {{ passwordMessage }}
        </p>
      }
    </div>
  }
</div>
