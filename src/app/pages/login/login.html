<div class="min-h-screen flex items-center justify-center bg-gray-100">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">

    <h1 class="text-3xl font-bold text-center mb-6">
      Sistema de Gestión
    </h1>

    <div class="mb-4">
      <label class="block mb-2 font-medium">
        Email
      </label>

      <input
        type="email"
        [(ngModel)]="email"
        class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="correo@email.com"
      >
    </div>

    <div class="mb-6">
      <label class="block mb-2 font-medium">
        Contraseña
      </label>

      <input
        type="password"
        [(ngModel)]="password"
        class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="********"
      >
    </div>

    <button
      (click)="login()"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg transition"
    >
      {{ loading ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <p class="text-center mt-4 text-red-500">
      {{ message }}
    </p>

  </div>

</div>
