<div class="fixed inset-0 flex items-center justify-center bg-main p-8">

  <div class="max-w-xl w-full bg-[#f4f4f3] rounded-[2rem] shadow-2xl">

    <div class="text-center pt-10 pb-4">
      <div class="w-40 h-40 mx-auto rounded-[2rem] overflow-hidden bg-white flex items-center justify-center">
        <img src="/logo.jpeg" alt="Meurzet" class="w-full h-full object-cover">
      </div>
    </div>

    <form (ngSubmit)="login()" class="px-10 pb-10">

      <div class="mb-6">
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          class="w-full px-5 py-4 rounded-2xl border-[1.5px] border-outline bg-white text-base outline-none transition-all duration-200 hover:border-[#1aa7c4] focus:border-[#1aa7c4] focus:outline-none focus:ring-[3px] focus:ring-[#1aa7c4]/10"
          placeholder="Correo electrónico"
          required
        >
      </div>

      <div class="mb-4 relative">
        <input
          id="password"
          name="password"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          class="w-full py-4 pl-5 pr-12 rounded-2xl border-[1.5px] border-outline bg-white text-base outline-none transition-all duration-200 hover:border-[#1aa7c4] focus:border-[#1aa7c4] focus:outline-none focus:ring-[3px] focus:ring-[#1aa7c4]/10"
          placeholder="Contraseña"
          required
        >
        <button type="button" (click)="showPassword = !showPassword"
          class="absolute right-4 top-1/2 -translate-y-1/2 bg-transparent border-none cursor-pointer p-0 leading-none"
          [style.color]="showPassword ? '#af4f35' : '#969fa3'" aria-label="Mostrar contraseña">
          <svg class="w-[1.3rem] h-[1.3rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            @if (showPassword) {
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            }
          </svg>
        </button>
      </div>

      @if (!showForgotPassword) {
        <div class="flex items-center justify-between mb-6">
          <label class="flex items-center gap-2 cursor-pointer text-sm text-[#384752] font-medium">
            <input type="checkbox" [(ngModel)]="remember" name="remember"
              class="w-4 h-4 accent-[#af4f35] cursor-pointer">
            Recordar usuario
          </label>
          <button type="button" (click)="showForgotPassword = true" class="bg-transparent border-none text-xs text-[#969fa3] cursor-pointer underline p-0">Olvidaste tu contraseña?</button>
        </div>
      }

      @if (showForgotPassword) {
        <div class="mb-4">
          <p class="text-sm text-[#384752] font-semibold mb-3">Restablecer contraseña</p>
          <input type="email" [(ngModel)]="forgotEmail" name="forgotEmail"
            class="w-full px-5 py-4 rounded-2xl border-[1.5px] border-outline bg-white text-base outline-none transition-all duration-200 hover:border-[#1aa7c4] focus:border-[#1aa7c4] focus:outline-none focus:ring-[3px] focus:ring-[#1aa7c4]/10"
            placeholder="Tu correo electrónico">
          @if (resetMessage) {
            <div class="mt-3 px-4 py-3 rounded-xl text-sm text-center border"
              [style.background]="resetMessage.includes('enviamos') ? '#f0fdf4' : '#fef2f2'"
              [style.color]="resetMessage.includes('enviamos') ? '#166534' : '#991b1b'"
              [style.border-color]="resetMessage.includes('enviamos') ? '#bbf7d0' : '#fecaca'">
              {{ resetMessage }}
            </div>
          }
          <div class="flex gap-2 mt-3">
            <button type="button" (click)="sendResetEmail()" [disabled]="loading"
              class="flex-1 py-3 rounded-xl font-semibold text-sm text-white border-none cursor-pointer transition-all duration-200 hover:-translate-y-0.5 hover:opacity-95 active:scale-[0.98]"
              style="background: linear-gradient(135deg, #af4f35, #e4912e);"
              [style.opacity]="loading ? '0.6' : '1'">
              {{ loading ? 'Enviando...' : 'Enviar enlace' }}
            </button>
            <button type="button" (click)="cancelForgotPassword()"
              class="px-4 py-3 rounded-xl text-sm text-slate-500 bg-slate-200 border-none cursor-pointer transition-all duration-200 hover:-translate-y-0.5 hover:opacity-95 active:scale-[0.98]">Cancelar</button>
          </div>
        </div>
      }

      @if (message) {
        <div class="mb-4 px-4 py-3 rounded-xl bg-red-50 text-red-800 text-sm text-center border border-red-200">
          {{ message }}
        </div>
      }

      @if (!showForgotPassword) {
        <button
          type="submit"
          [disabled]="loading"
          class="w-full py-4 rounded-2xl font-bold text-lg text-white border-none cursor-pointer transition-all duration-200 mb-8 hover:-translate-y-0.5 hover:opacity-95 active:scale-[0.98]"
          style="background: linear-gradient(135deg, #af4f35, #e4912e);"
          [style.opacity]="loading ? '0.6' : '1'">
          {{ loading ? 'Ingresando...' : 'Iniciar Sesión' }}
        </button>

        <div class="flex items-center">
          <div class="flex-1 h-px" style="background: linear-gradient(90deg, transparent, #eec997, transparent);"></div>
          <span class="px-3 text-xs text-[#969fa3] font-medium">ACCESO SEGURO</span>
          <div class="flex-1 h-px" style="background: linear-gradient(90deg, transparent, #eec997, transparent);"></div>
        </div>
      }

    </form>
  </div>
</div>
